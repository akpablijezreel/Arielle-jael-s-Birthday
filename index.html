<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;min-height:100vh;background:#ffe6ef;display:flex;align-items:center;justify-content:center;padding:20px;}
.bg{position:fixed;inset:0;background:url('birthday_photo.jpg') center/cover no-repeat;filter:blur(14px) brightness(0.7);z-index:-1}
.card{background:rgba(255,255,255,0.92);width:100%;max-width:420px;border-radius:32px;padding:28px 24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.badge{background:#ff4d8d;color:white;padding:6px 14px;border-radius:20px;font-size:12px;display:inline-block;margin-bottom:12px}
h1{font-family:'Pacifico',cursive;font-size:38px;color:#ff2e7a}
h2{font-size:22px;margin:8px 0 14px;color:#333}
.photo-circle{width:140px;height:140px;border-radius:50%;object-fit:cover;border:5px solid white;box-shadow:0 8px 20px rgba(0,0,0,0.25);margin:12px auto;display:block}
.message{color:#444;font-size:15px;line-height:1.6;margin:16px 0}
.btn{background:linear-gradient(135deg,#ff2e7a,#ff8a2e);color:white;border:none;padding:14px 28px;border-radius:30px;font-size:16px;font-weight:600;width:100%;cursor:pointer}
.hearts{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:10}
.heart{position:absolute;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(-10vh)}100%{transform:translateY(110vh)}}
input{width:100%;padding:12px;border:2px solid #ffd0de;border-radius:12px;margin:8px 0;font-family:Poppins}
</style>
</head>
<body>
<div class="bg"></div>
<div class="hearts" id="hearts"></div>
<div class="card">
  <div class="badge">🎂 TODAY IS YOUR DAY 🎂</div>
  <h1>Happy Birthday!</h1>
  <h2 id="nameLine">To My Favorite Person ✨</h2>
  <img class="photo-circle" src="birthday_photo.jpg">
  <p class="message">Wishing you laughter, love & all your favorite things.<br><br>Keep shining! 🌟</p>
  <input id="customName" placeholder="Type her name (e.g. Ama)">
  <button class="btn" onclick="celebrate()">Tap for Surprise 🎉</button>
</div>
<script>
function celebrate(){
  for(let i=0;i<40;i++)createHeart();
  let n=document.getElementById('customName').value;
  if(n){document.getElementById('nameLine').innerHTML='To '+n+' ✨';document.querySelector('h1').innerHTML='Happy Birthday, '+n+'!'}
  document.querySelector('.btn').innerHTML='YAY! 🎉 Happy Birthday!';
}
function createHeart(){
  const h=document.createElement('div');h.className='heart';
  h.innerHTML=['🎉','💖','🎂','✨','😘'][Math.floor(Math.random()*4)];
  h.style.left=Math.random()*100+'vw';h.style.fontSize=(16+Math.random()*20)+'px';
  h.style.animationDuration=(2+Math.random()*3)+'s';h.style.top='-5vh';
  document.getElementById('hearts').appendChild(h);setTimeout(()=>h.remove(),5000);
}
window.onload=()=>{for(let i=0;i<20;i++)setTimeout(createHeart,i*150)}
</script>
</body>
  </html>
